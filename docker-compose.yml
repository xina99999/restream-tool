services:
  rtsp-restream-tool:
    build:
      context: .
      args:
        PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.12-slim
    container_name: rtsp-restream-tool
    restart: unless-stopped
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RESTREAM_DATA_DIR: /data
      RESTREAM_UPLOAD_DIR: /data/videos
      RESTREAM_DB_PATH: /data/restream.db
      # Comma-separated container paths for videos that already exist.
      RESTREAM_LIBRARY_DIRS: /library/videos
      RESTREAM_USERNAME: ${RESTREAM_USERNAME:-}
      RESTREAM_PASSWORD: ${RESTREAM_PASSWORD:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      RESTREAM_STALL_TIMEOUT_SECONDS: 120
      RESTREAM_AUTO_RETRY_DELAY_SECONDS: 10
      # 0 means unlimited retries until the video completes.
      RESTREAM_AUTO_RETRY_MAX_RETRIES: 0
      # From inside Docker, localhost is this tool container. Use host.docker.internal
      # when MediaMTX is running on the host machine.
      RESTREAM_PUBLISH_HOST: host.docker.internal
      RESTREAM_PUBLISH_PORT: 18554
      # Use host/IP that viewers can reach from their machine.
      RESTREAM_VIEW_HOST: localhost
      RESTREAM_VIEW_PORT: 18554
    volumes:
      - restream-data:/data
      # Change this host path to your existing video folder.
      - ${RESTREAM_VIDEO_LIBRARY_DIR:-./videos}:/library/videos:ro

  restream-download-worker:
    build:
      context: .
      args:
        PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.12-slim
    container_name: restream-download-worker
    command: ["python", "-m", "app.download_worker"]
    restart: unless-stopped
    environment:
      RESTREAM_DATA_DIR: /data
      RESTREAM_UPLOAD_DIR: /data/videos
      RESTREAM_DB_PATH: /data/restream.db
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - restream-data:/data

volumes:
  restream-data:
